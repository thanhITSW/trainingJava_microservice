spring.application.name=gateway-service

eureka.client.service-url.defaultZone=http://localhost:9000/eureka/
eureka.instance.prefer-ip-address=true
server.port=8080

# C?u hình Spring Cloud Gateway - Route cho auth-service
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/**
spring.cloud.gateway.routes[0].filters[0]=StripPrefix=1

# C?u hình Spring Cloud Gateway - Route cho user-service
spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=lb://USER-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/users/**

# C?u hình Spring Cloud Gateway - Route cho book-service
spring.cloud.gateway.routes[2].id=book-service
spring.cloud.gateway.routes[2].uri=lb://BOOK-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/books/**

spring.zipkin.base-url=http://localhost:9411
spring.sleuth.sampler.probability=1.0

spring.main.web-application-type=reactive